# version attribute removed (obsolete in newer Docker Compose versions)

services:
  # Infrastructure Services
  mongodb:
    image: mongo:7
    container_name: speak-sync-mongodb
    environment:
      MONGO_INITDB_DATABASE: speak_sync_lifestyle
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - speak-sync-network

  # Redis is now Upstash (cloud, free) — remove local container
  # REDIS_URL in .env points to: rediss://default:password@host.upstash.io:6379
  # No local redis container needed anymore.

  # Application Services
  scheduler-service:
    build:
      context: .
      dockerfile: apps/scheduler-service/Dockerfile
    container_name: speak-sync-scheduler
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "3001:3001"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - speak-sync-network

  gateway-service:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    container_name: speak-sync-gateway
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      SCHEDULER_SERVICE_URL: http://scheduler-service:3001
      AI_BRAIN_SERVICE_URL: http://ai-brain-service:8000
      LIFESTYLE_SERVICE_URL: http://lifestyle-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "3000:3000"
    depends_on:
      scheduler-service:
        condition: service_healthy
      ai-brain-service:
        condition: service_healthy
      lifestyle-service:
        condition: service_healthy
      # redis dependency removed — using Upstash cloud Redis (no local container)
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - speak-sync-network

  ai-brain-service:
    build:
      context: .
      dockerfile: apps/ai-brain-service/Dockerfile
    container_name: speak-sync-ai-brain
    environment:
      PORT: 8000
      GRPC_PORT: 50051
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Supabase (PostgreSQL + Realtime + Storage)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Upstash Redis (cloud, free tier)
      REDIS_URL: ${REDIS_URL}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama-3.1-70b-versatile}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8000:8000"    # REST API
      - "50051:50051"  # gRPC streaming
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - speak-sync-network

  lifestyle-service:
    build:
      context: .
      dockerfile: apps/lifestyle-service/Dockerfile
    container_name: speak-sync-lifestyle
    depends_on:
      mongodb:
        condition: service_started
    environment:
      PORT: 8001
      HOST: 0.0.0.0
      MONGODB_URI: mongodb+srv://speak-sync:131180@speak-sync.oazczpg.mongodb.net/speak_sync_lifestyle?appName=speak-sync
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    ports:
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - speak-sync-network

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile
    container_name: speak-sync-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      SCHEDULER_SERVICE_URL: http://scheduler-service:3001
      AI_BRAIN_SERVICE_URL: http://ai-brain-service:8000
      LIFESTYLE_SERVICE_URL: http://lifestyle-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - scheduler-service
    restart: unless-stopped
    networks:
      - speak-sync-network

volumes:
  mongodb_data:
  # redis_data removed — using Upstash cloud Redis (free tier) instead


networks:
  speak-sync-network:
    driver: bridge
