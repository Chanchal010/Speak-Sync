syntax = "proto3";

package voice;

// Voice AI Service - Complete STT, TTS, and Conversation handling
service VoiceService {
  // ===== STT (Speech-to-Text) =====
  
  // Bidirectional streaming for real-time transcription
  // Client sends audio chunks, server streams back transcription results
  rpc StreamTranscribe(stream AudioChunk) returns (stream TranscriptChunk);
  
  // Single audio file transcription (HTTP alternative)
  rpc TranscribeAudio(AudioRequest) returns (TranscriptResponse);
  
  // ===== TTS (Text-to-Speech) =====
  
  // Single text-to-speech synthesis
  rpc Synthesize(SynthesizeRequest) returns (AudioResponse);
  
  // Stream synthesized speech (sentence by sentence for lower latency)
  rpc StreamSynthesize(SynthesizeRequest) returns (stream AudioChunk);
  
  // ===== Complete Conversation Flow =====
  
  // Full conversation: User speaks → STT → LLM → TTS → User hears
  // Bidirectional streaming for real-time voice conversation
  rpc Converse(stream AudioChunk) returns (stream ConversationResponse);
}

// ============================================
// STT (Speech-to-Text) Messages
// ============================================

message AudioChunk {
  bytes audio_data = 1;        // Raw audio bytes (WAV/MP3/M4A)
  string session_id = 2;       // Unique session identifier
  int32 chunk_index = 3;       // Sequence number for ordering
  string format = 4;           // "wav", "mp3", "m4a"
  int32 sample_rate = 5;       // Audio sample rate (e.g., 16000)
}

message TranscriptChunk {
  string text = 1;             // Transcribed text
  bool is_final = 2;           // True when transcription is complete
  float confidence = 3;        // Confidence score (0.0 to 1.0)
  string language = 4;         // Detected language code (e.g., "en", "hi")
}

message AudioRequest {
  bytes audio_data = 1;        // Full audio file bytes
  string user_id = 2;          // User identifier
  string language = 3;         // Expected language (optional, auto-detect if empty)
  string format = 4;           // Audio format: "wav", "mp3", "m4a"
}

message TranscriptResponse {
  string text = 1;             // Full transcription
  string language = 2;         // Detected language
  float confidence = 3;        // Overall confidence score
  int32 duration_ms = 4;       // Audio duration in milliseconds
}

// ============================================
// TTS (Text-to-Speech) Messages
// ============================================

message SynthesizeRequest {
  string text = 1;                    // Text to synthesize
  string voice = 2;                   // Voice ID: "en-us-female-calm", "en-us-female-energetic", etc.
  string emotion = 3;                 // Emotion: "calm", "energetic", "empathetic", "neutral"
  string user_id = 4;                 // User identifier
  string format = 5;                  // Output format: "wav", "mp3"
  float speaking_rate = 6;            // Speed: 0.5 (slow) to 2.0 (fast), default: 1.0
  bool use_cache = 7;                 // Use cached audio if available (default: true)
}

message AudioResponse {
  bytes audio_data = 1;               // Complete audio file bytes
  string format = 2;                  // Audio format
  int32 duration_ms = 3;              // Audio duration in milliseconds
  int32 sample_rate = 4;              // Sample rate (e.g., 16000)
  bool from_cache = 5;                // True if served from cache
}

// ============================================
// Conversation Flow Messages
// ============================================

message ConversationResponse {
  oneof response_type {
    TranscriptChunk transcript = 1;   // What user said (STT output)
    ProcessingStatus processing = 2;   // LLM processing status
    string llm_text = 3;               // AI response text (before TTS)
    AudioChunk audio = 4;              // AI response audio (TTS output)
    ActionResult action = 5;           // Action performed (task created, habit logged, etc.)
  }
  bool is_final = 6;                   // True when entire response is complete
  string session_id = 7;               // Session identifier
  int64 timestamp = 8;                 // Unix timestamp (milliseconds)
}

message ProcessingStatus {
  string status = 1;                   // "transcribing", "understanding", "generating", "synthesizing"
  string message = 2;                  // Human-readable status message
  float progress = 3;                  // Progress percentage (0.0 to 1.0)
}

message ActionResult {
  string action_type = 1;              // "task_created", "habit_logged", "event_scheduled", "question_answered"
  string entity_id = 2;                // ID of created/updated entity
  bool success = 3;                    // True if action succeeded
  string message = 4;                  // Result message
  map<string, string> metadata = 5;    // Additional metadata
}

// ============================================
// Health Check
// ============================================

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;                  // Service name to check
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string message = 2;
  map<string, string> details = 3;     // Component-specific health info
}
